<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scheda allievo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================= GRAFICA SPORT & SERVICES ================= */
:root{
  --navy:#1C2440; --slate:#304143; --slate2:#3E5052; --gold:#C2A970; --cream:#F6F2E8;
  --paper:#FFFFFF; --bg:#EEF0EC; --ink:#1E2624; --muted:#62706C; --line:#DCE1DC;
  --ok:#2E7D5B; --warn:#B7791F; --ko:#B5443A; --tint:#F3F5F1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Source Sans 3","Segoe UI",Arial,sans-serif}
h1,h2,h3,.oswald{font-family:"Oswald","Arial Narrow",Arial,sans-serif;letter-spacing:.02em}
.wrap{max-width:960px;margin:0 auto;padding:18px 14px 60px}

/* barra comandi */
.toolbar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px}
.toolbar b{font-family:Oswald,Arial Narrow,sans-serif;letter-spacing:.05em}
.seg{display:inline-flex;border:1px solid var(--gold);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:#fff;border:0;padding:8px 14px;font:600 14px "Source Sans 3",sans-serif;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--navy)}
.tbtn{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:8px 14px;font:600 14px "Source Sans 3",sans-serif;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* copertina */
.cover{background:linear-gradient(135deg,var(--slate) 0%,var(--slate) 62%,var(--navy) 62%);color:var(--cream);border-radius:14px;padding:26px 26px 22px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin:18px 0 22px;position:relative;overflow:hidden}
.cover img.logo{width:110px;height:110px;border-radius:50%;box-shadow:0 0 0 3px var(--gold)}
.cover .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.cover h1{margin:2px 0 4px;font-size:clamp(30px,6vw,46px);line-height:1.05;color:#fff}
.cover .sub{margin:0;opacity:.9}
.cover .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-block;border:1px solid var(--gold);color:var(--cream);border-radius:999px;padding:3px 12px;font-size:13px}

/* sezioni */
body{counter-reset:sez}
section.page{counter-increment:sez}
.sec-title .n::before{content:counter(sez)}
section.page{background:var(--paper);border-radius:14px;padding:22px 22px 18px;margin-bottom:20px;box-shadow:0 1px 0 var(--line)}
.sec-title{display:flex;align-items:center;gap:12px;margin:0 0 14px;border-bottom:3px solid var(--gold);padding-bottom:8px}
.sec-title .n{background:var(--navy);color:var(--gold);font-family:Oswald,sans-serif;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none}
.sec-title h2{margin:0;font-size:22px;text-transform:uppercase;color:var(--navy)}
.sec-title .tag{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.empty{color:var(--muted);font-style:italic}

/* tabelle */
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--tint);text-align:left;font-weight:700;color:var(--slate);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 22px}
.kv div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:#E3F1EA;color:var(--ok)} .b-warn{background:#FBF0DD;color:var(--warn)} .b-ko{background:#F8E3E0;color:var(--ko)} .b-n{background:var(--tint);color:var(--muted)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.summary .box{background:var(--tint);border-radius:10px;padding:10px 14px;min-width:120px}
.summary .box b{display:block;font-family:Oswald,sans-serif;font-size:24px;color:var(--navy)}

/* valutazioni */
.area-head{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:center;margin-bottom:8px}
.area-head .avg{font-family:Oswald,sans-serif;font-size:40px;color:var(--navy);line-height:1}
.area-head .avg small{font-size:15px;color:var(--muted)}
.items{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;break-inside:avoid}
.item .top{display:flex;align-items:center;gap:12px}
.item h3{margin:0;font-size:17px;color:var(--slate);flex:1}
.score{font-family:Oswald,sans-serif;font-size:20px;color:var(--navy);min-width:52px;text-align:right}
.bar{height:8px;background:var(--tint);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--slate2),var(--gold));border-radius:99px}
.item p{margin:4px 0 0}
.media{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.media img,.media video{height:120px;border-radius:8px;border:1px solid var(--line);background:#000}
.legend{font-size:13px;color:var(--muted);margin:0 0 12px}

/* sintesi */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 6px;font-size:18px;text-transform:uppercase}
.card ul{margin:0;padding-left:18px}
.forte{background:#E8F3EC;border-left:5px solid var(--ok)} .forte h3{color:var(--ok)}
.debole{background:#FBF1E3;border-left:5px solid var(--warn)} .debole h3{color:var(--warn)}
.lavori{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.lavori .card{background:var(--tint);border-top:4px solid var(--navy)}
.lavori .card h3{color:var(--navy);font-size:16px}

footer{text-align:center;color:var(--muted);font-size:13px;margin-top:26px}

/* versione giocatore: nasconde la parte amministrativa */
body.giocatore .solo-maestro{display:none!important}
body.maestro .solo-giocatore{display:none!important}

@media (max-width:640px){
  .cover{grid-template-columns:1fr;text-align:center;background:var(--slate)} .cover img.logo{margin:0 auto}
  .cover .stats{justify-content:center}
  .area-head,.two{grid-template-columns:1fr}
  .area-head svg{max-width:260px;margin:0 auto}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:12.5px}
  .toolbar{display:none}
  .wrap{padding:0;max-width:none}
  section.page{box-shadow:none;border-radius:0;padding:0;break-before:page}
  .cover{-webkit-print-color-adjust:exact;print-color-adjust:exact;margin-top:0}
  .bar,.bar i,.sec-title .n,.forte,.debole,.lavori .card,th,.badge,.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  video{display:none}
}
</style>
</head>
<body class="maestro">

<div class="toolbar">
  <b>SCHEDA ALLIEVO · SPORT &amp; SERVICES</b>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <div class="seg" role="group" aria-label="Versione">
      <button id="bM" class="on" onclick="setMode('maestro')">Versione maestro</button>
      <button id="bG" onclick="setMode('giocatore')">Versione giocatore</button>
    </div>
    <button class="tbtn" id="bP" onclick="window.print()">Stampa / PDF</button>
  </div>
</div>

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtData = d => { if(!d) return ""; const [y,m,g]=d.split("-"); return `${g}/${m}/${y}`; };
const giorno = d => ["dom","lun","mar","mer","gio","ven","sab"][new Date(d+"T12:00").getDay()];
const media = arr => { const v=arr.map(x=>x.voto).filter(x=>typeof x==="number"); return v.length? (v.reduce((a,b)=>a+b,0)/v.length):null; };
const vuoto = (t="da compilare") => `<span class="empty">${t}</span>`;

function badge(stato){
  const s=(stato||"").toLowerCase();
  const cls = /consegnat|presente|pagat|valido/.test(s) ? "b-ok" : /da consegnare|giustificat|da confermare|programmat/.test(s) ? "b-warn" : /scadut|assente|manca/.test(s) ? "b-ko" : "b-n";
  return `<span class="badge ${cls}">${esc(stato||"da verificare")}</span>`;
}

function titolo(n, t, tag){ return `<div class="sec-title"><span class="n"></span><h2>${t}</h2>${tag?`<span class="tag">${tag}</span>`:""}</div>`; }

/* etichette corte per il grafico */
const corto = v => v.replace(" a rimbalzo"," rimb.").replace(" al vetro"," vetro").replace("Pallonetto di ","Pall. ").replace("Volée di ","Volée ")
  .replace("Coordinamento con il partner","Intesa partner")
  .replace("Attenzione sulla palla","Attenz. palla").replace("Continuità di concentrazione","Concentrazione").replace("Posizione in ","Posiz. ").replace("Disciplina tattica","Disciplina");
/* grafico radar SVG */
function radar(items){
  const N=items.length, R=95, cx=120, cy=120;
  const pt=(i,r)=>{const a=-Math.PI/2+2*Math.PI*i/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let g="";
  [2,4,6,8,10].forEach(l=>{g+=`<polygon points="${items.map((_,i)=>pt(i,R*l/10).join(",")).join(" ")}" fill="none" stroke="#DCE1DC"/>`;});
  items.forEach((_,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#DCE1DC"/>`;});
  const has=items.some(x=>typeof x.voto==="number");
  if(has){g+=`<polygon points="${items.map((x,i)=>pt(i,R*(x.voto||0)/10).join(",")).join(" ")}" fill="rgba(194,169,112,.35)" stroke="#1C2440" stroke-width="2"/>`;}
  items.forEach((x,i)=>{const [px,py]=pt(i,R+12);g+=`<text x="${px}" y="${py}" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="#62706C">${esc(corto(x.voce))}</text>`;});
  if(!has) g+=`<text x="${cx}" y="${cy}" font-size="11" text-anchor="middle" fill="#62706C">in valutazione</text>`;
  return `<svg viewBox="-30 -10 300 262" width="100%" role="img" aria-label="Grafico delle valutazioni">${g}</svg>`;
}

function area(n, nome, items, tag){
  const m=media(items);
  const cards=items.map(x=>{
    const v=typeof x.voto==="number";
    const foto=(x.foto||[]).map(f=>`<img src="Foto/${esc(f)}" alt="${esc(x.voce)}" onerror="this.remove()">`).join("");
    const vid=(x.video||[]).map(f=>`<video src="Video/${esc(f)}" controls preload="metadata"></video>`).join("");
    return `<div class="item"><div class="top"><h3>${esc(x.voce)}</h3><span class="score">${v?x.voto+"<small style='font-size:12px;color:#62706C'>/10</small>":"–"}</span></div>
      <div class="bar"><i style="width:${v?x.voto*10:0}%"></i></div>
      <p>${x.descrizione?esc(x.descrizione):vuoto("in valutazione")}</p>
      ${foto||vid?`<div class="media">${foto}${vid}</div>`:""}</div>`;
  }).join("");
  return `<section class="page">${titolo(n,nome,tag)}
    <div class="area-head"><div><div class="avg">${m!==null?m.toFixed(1):"–"}<small> / 10 media</small></div>
      <p class="legend">Scala 1–10 · 1-4 da costruire · 5-6 sufficiente · 7-8 buono · 9-10 eccellente</p></div>${radar(items)}</div>
    <div class="items">${cards}</div></section>`;
}

function render(){
  const S=SCHEDA, A=S.anagrafica;
  const nome=`${A.Nome} ${A.Cognome}`;
  const pres=S.presenze;
  const nPres=pres.filter(p=>p.stato==="presente").length;
  const nSvolte=pres.filter(p=>["presente","assente","giustificato"].includes(p.stato)).length;
  const totPag=S.pagamenti.reduce((a,p)=>a+(+p.importo||0),0);
  let h="";

  /* COPERTINA */
  h+=`<div class="cover"><img class="logo" src="${LOGO}" alt="Logo Sport & Services Padel">
    <div><div class="eyebrow">Padel School · Stagione ${esc(S.stagione)}</div>
    <h1>${esc(nome)}</h1>
    <p class="sub"><span class="solo-maestro">Scheda allievo – versione maestro</span><span class="solo-giocatore">Il tuo percorso di crescita</span></p>
    <div class="stats"><span class="chip">${esc(A.Corso||"")}</span>
      <span class="chip solo-maestro">Presenze ${nPres}/${nSvolte}</span>
      <span class="chip">Aggiornata il ${esc(S.aggiornata)}</span></div></div></div>`;

  /* 1 ANAGRAFICA */
  h+=`<section class="page solo-maestro">${titolo(1,"Dati anagrafici","solo maestro")}
    <div class="kv">${Object.entries(A).map(([k,v])=>`<div><span>${esc(k)}</span><span>${v?esc(v):vuoto()}</span></div>`).join("")}</div></section>`;

  /* 2 DOCUMENTI */
  h+=`<section class="page solo-maestro">${titolo(2,"Documenti","solo maestro")}
    <table><thead><tr><th>Documento</th><th>Stato</th><th>Scadenza</th><th>Note</th></tr></thead><tbody>
    ${S.documenti.map(d=>`<tr><td><b>${esc(d.nome)}</b></td><td>${badge(d.stato)}</td><td>${d.scadenza?fmtData(d.scadenza):"–"}</td><td>${esc(d.note)||"–"}</td></tr>`).join("")}
    </tbody></table></section>`;

  /* 3 PAGAMENTI */
  h+=`<section class="page solo-maestro">${titolo(3,"Pagamenti","solo maestro")}
    <div class="summary"><div class="box"><b>€ ${totPag.toLocaleString("it-IT")}</b>totale versato</div><div class="box"><b>${S.pagamenti.length}</b>pagamenti registrati</div></div>
    <table><thead><tr><th>Data</th><th>Voce</th><th>Importo</th><th>Metodo</th><th>Ricevuta</th></tr></thead><tbody>
    ${S.pagamenti.length?S.pagamenti.map(p=>`<tr><td>${fmtData(p.data)}</td><td>${esc(p.voce)}</td><td>€ ${esc(p.importo)}</td><td>${esc(p.metodo)}</td><td>${esc(p.ricevuta)||"–"}</td></tr>`).join(""):`<tr><td colspan="5">${vuoto("nessun pagamento registrato")}</td></tr>`}
    </tbody></table></section>`;

  /* 4 PRESENZE */
  h+=`<section class="page solo-maestro">${titolo(4,"Presenze al corso","dal 1° novembre 2026")}
    <div class="summary"><div class="box"><b>${nPres}</b>presenze</div><div class="box"><b>${pres.filter(p=>p.stato==="assente").length}</b>assenze</div><div class="box"><b>${pres.filter(p=>p.stato==="giustificato").length}</b>giustificate</div><div class="box"><b>${nSvolte?Math.round(nPres/nSvolte*100):0}%</b>frequenza</div></div>
    <table><thead><tr><th>Data</th><th>Attività</th><th>Stato</th></tr></thead><tbody>
    ${pres.map(p=>`<tr><td>${giorno(p.data)} ${fmtData(p.data)}</td><td>${esc(p.attivita)}</td><td>${badge(p.stato)}</td></tr>`).join("")}
    </tbody></table></section>`;

  /* 5-8 VALUTAZIONI */
  h+=area(5,"Scheda tecnica",S.tecnica,"colpi");
  h+=area(6,"Profilo atletico",S.atletica);
  h+=area(7,"Profilo tattico",S.tattica);
  h+=area(8,"Profilo mentale",S.mentale);

  /* 9 SINTESI */
  const lista=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:vuoto("in valutazione");
  h+=`<section class="page">${titolo(9,"Punti di forza e lavoro consigliato")}
    <div class="two"><div class="card forte"><h3>Punti di forza</h3>${lista(S.sintesi.forti)}</div>
    <div class="card debole"><h3>Da migliorare</h3>${lista(S.sintesi.deboli)}</div></div>
    <div class="lavori">${Object.entries(S.sintesi.lavori).map(([k,v])=>`<div class="card"><h3>Lavoro ${k.toLowerCase()}</h3>${lista(v)}</div>`).join("")}</div></section>`;

  h+=`<footer>A.S.D. Sport &amp; Services · Padel School ${esc(S.stagione)} · www.sportandservicespadel.it</footer>`;
  document.getElementById("app").innerHTML=h;
  document.title=`Scheda ${nome}`;
}

function setMode(m){
  document.body.className=m;
  document.getElementById("bM").classList.toggle("on",m==="maestro");
  document.getElementById("bG").classList.toggle("on",m==="giocatore");
}
render();
/* sul telefono (pagina online) la stampa non è disponibile: si fa dal PC */
try{ if(window.self!==window.top) document.getElementById("bP").style.display="none"; }catch(e){ document.getElementById("bP").style.display="none"; }
setMode(window.__MODO__||"giocatore");
</script>
</body>
</html>
