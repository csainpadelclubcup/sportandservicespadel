<style>
/* Planner Sport & Services: barra blu notte con menù, contenuto su carta chiara; padel giallo, tennis arancione come nel foglio */
:root{
  --navy:#1C2440; --gold:#C2A970; --paper:#FFFFFF; --bg:#EEF0EC; --ink:#1E2624; --muted:#5E6B67;
  --line:#DCE1DC; --tint:#F4F5F1;
  --padel:#FFF27A; --padel-ink:#5B4D00; --tennis:#FFB347; --tennis-ink:#5A2E00;
  --ok:#2E7D5B; --warn:#A8670F; --ko:#B5443A;
  --display:"Oswald","Arial Narrow",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.02em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:10px 16px 0}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:24px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em}
.top .stato{font-size:13px;opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px}
nav button{background:transparent;border:0;color:#E8E4D8;padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
nav button.on{color:var(--gold);border-bottom-color:var(--gold)}
main{max-width:1100px;margin:0 auto;padding:16px}
.panel{background:var(--paper);border-radius:12px;padding:16px;box-shadow:0 1px 0 var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--navy);border-radius:8px;overflow:hidden}
.seg button{background:var(--paper);border:0;padding:8px 14px;color:var(--navy);font-weight:600}
.seg button.on{background:var(--navy);color:var(--gold)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.sec{background:var(--paper);color:var(--navy);border:1px solid var(--navy)}
.btn.del{background:var(--paper);color:var(--ko);border:1px solid var(--ko)}
.btn:disabled{opacity:.5;cursor:default}
select,input,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:80px}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:15px}
.msg.err{background:#F8E3E0;color:var(--ko)} .msg.info{background:var(--tint);color:var(--muted)} .msg.ok{background:#E3F1EA;color:var(--ok)}
/* planner */
.days{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.day{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.day header{background:var(--tint);padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}
.day header b{font-family:var(--display);font-size:18px;color:var(--navy);text-transform:capitalize}
.day header span{font-size:13px;color:var(--muted)}
.day.oggi header{background:var(--navy)} .day.oggi header b{color:var(--gold)} .day.oggi header span{color:#E8E4D8}
.slot{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:15px}
.slot:last-child{border-bottom:0}
.ora{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy)}
.nomi{border-radius:6px;padding:2px 8px}
.nomi.padel{background:var(--padel);color:var(--padel-ink)} .nomi.tennis{background:var(--tennis);color:var(--tennis-ink)}
.nomi small{display:block;opacity:.8}
.vuoto{color:var(--muted);font-style:italic;padding:10px 12px;font-size:14px}
.note{background:#FBF7EC;border-top:1px dashed var(--gold);padding:6px 12px;font-size:13.5px;color:#5A4A1E}
.note div+div{margin-top:3px}
.note .rich{font-weight:700;color:var(--warn)}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto}
.legend{display:flex;gap:12px;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* tabelle */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;background:var(--tint);color:var(--navy);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:#FAF8F1}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700}
.pill.padel{background:var(--padel);color:var(--padel-ink)} .pill.tennis{background:var(--tennis);color:var(--tennis-ink)}
.pill.fare{background:#FBF0DD;color:var(--warn)} .pill.fatto{background:#E3F1EA;color:var(--ok)} .pill.corso{background:#E2E8F5;color:var(--navy)} .pill.errore{background:#F8E3E0;color:var(--ko)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin:12px 0;padding:14px;border:1px solid var(--gold);border-radius:10px;background:#FFFDF7}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
.form .full{grid-column:1/-1}
.form .azioni{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--ink);font-weight:400}
.check label{flex-direction:row;align-items:center;color:var(--ink);font-weight:400}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px;margin-bottom:14px}
.cal .h{font-size:12px;text-align:center;color:var(--muted);font-weight:700}
.cal button{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:#fff;position:relative;font-variant-numeric:tabular-nums}
.cal button.fuori{visibility:hidden}
.cal button.oggi{border-color:var(--navy);font-weight:700}
.cal button.sel{background:var(--navy);color:var(--gold)}
.cal button.ha::after{content:"";position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--gold)}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.calhead b{font-family:var(--display);font-size:18px;color:var(--navy);min-width:150px;text-align:center;text-transform:capitalize}
.hint{font-size:14px;color:var(--muted);margin:6px 0 12px}

/* home */
.top{background:linear-gradient(120deg,#1C2440 0%,#26324F 60%,#304143 100%)}
.top h1{display:flex;align-items:center;gap:10px}
.top h1 .mono{width:34px;height:34px;border-radius:9px;border:2px solid var(--gold);display:grid;place-items:center;font-size:18px;letter-spacing:0}
.hero{background:linear-gradient(120deg,#1C2440,#304143);color:#F6F2E8;border-radius:14px;padding:20px 22px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px;box-shadow:0 8px 24px rgba(28,36,64,.18)}
.hero .eb{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h2{font-size:clamp(26px,5vw,38px);color:#fff;text-transform:capitalize;margin-top:4px}
.hero .conti{display:flex;gap:10px;flex-wrap:wrap}
.hero .conto{border:1px solid rgba(194,169,112,.6);border-radius:10px;padding:8px 14px;min-width:92px}
.hero .conto b{display:block;font-family:var(--display);font-size:26px;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.hero .conto span{font-size:13px;opacity:.85}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-bottom:18px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--navy);box-shadow:0 2px 0 var(--line);transition:transform .15s,box-shadow .15s;min-height:132px}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(28,36,64,.14);border-color:var(--gold)}
.tile svg{width:38px;height:38px;padding:8px;border-radius:10px;background:var(--navy);color:var(--gold);box-sizing:content-box}
.tile b{font-family:var(--display);font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.tile small{color:var(--muted);font-size:13.5px;line-height:1.3}
.duo{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.box{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.box h3{background:var(--tint);color:var(--navy);font-size:17px;padding:9px 14px;border-bottom:1px solid var(--line);text-transform:uppercase}
.cmd{padding:8px 14px;border-bottom:1px solid var(--line);font-size:15px;display:grid;grid-template-columns:86px 1fr;gap:8px}
.cmd:last-child{border-bottom:0}
.cmd .d{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
#view.panel.home{background:transparent;box-shadow:none;padding:0}
@media (max-width:600px){.tiles{grid-template-columns:1fr 1fr}.tile{min-height:118px;padding:13px}}
@media (max-width:600px){main{padding:10px}.panel{padding:12px}}

/* layout compatto: telefono piccolo, tablet e PC più grandi */
html{font-size:15px}
.top{padding:10px 14px}
.top .row{min-height:40px}
.top h1{font-size:20px;flex:1}
.top h1 .mono{width:30px;height:30px;font-size:16px}
.back{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:6px 10px;font-weight:700}
.tile{position:relative;overflow:hidden;background:linear-gradient(145deg,#1C2440 0%,#2B3858 70%,#304143 100%);border:1px solid rgba(194,169,112,.55);color:#F6F2E8;box-shadow:0 6px 16px rgba(28,36,64,.18);align-items:center;justify-content:center;text-align:center;gap:8px;min-height:112px;padding:14px 10px}
.tile::after{content:"";position:absolute;inset:6px;border:1px solid rgba(194,169,112,.25);border-radius:10px;pointer-events:none}
.tile:hover{border-color:var(--gold);box-shadow:0 12px 26px rgba(28,36,64,.28)}
.tile:active{transform:scale(.98)}
.tile svg{width:28px;height:28px;padding:9px;border-radius:50%;background:rgba(194,169,112,.14);color:var(--gold);border:1px solid rgba(194,169,112,.6)}
.tile b{font-size:15px;color:#fff;letter-spacing:.05em;line-height:1.15}
.tile small{color:#CFC9B8;font-size:12px}
.tiles{grid-template-columns:repeat(2,1fr);gap:10px;margin:2px 0 16px}
.tile.big{grid-column:1/-1;flex-direction:row;justify-content:flex-start;text-align:left;min-height:84px;padding:14px 18px;gap:14px}
.tile.big b{font-size:18px}
main{padding:12px}
.box h3{font-size:15px}
.slot,.cmd{font-size:14px}
@media (min-width:700px){
  html{font-size:16px}
  .top h1{font-size:24px}
  .tiles{grid-template-columns:repeat(3,1fr);gap:14px}
  .tile{min-height:150px}
  .tile svg{width:34px;height:34px;padding:12px}
  .tile b{font-size:18px} .tile small{font-size:13.5px}
  .tile.big{grid-column:auto;flex-direction:column;justify-content:center;text-align:center;min-height:150px}
  main{padding:20px}
}
@media (min-width:1100px){
  html{font-size:17px}
  .tiles{grid-template-columns:repeat(5,1fr);gap:16px}
  .tile{min-height:190px}
  .tile svg{width:40px;height:40px;padding:14px}
  .tile b{font-size:20px}
}
.wiz{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.wiz span{flex:1;min-width:84px;text-align:center;font-size:12px;font-weight:700;padding:7px 4px;border-radius:8px;background:var(--tint);color:var(--muted);border-bottom:3px solid transparent}
.wiz span.on{background:var(--navy);color:var(--gold)}
.wiz span.ok{color:var(--ok);border-bottom-color:var(--ok)}
.voci{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:-6px 0 6px;-webkit-overflow-scrolling:touch}
.voci span{flex:0 0 auto;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--paper);color:var(--navy);border:1px solid var(--line,#cfd6e4);cursor:pointer;white-space:nowrap}
.voci span.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.voci span.ok{border-color:var(--ok)}
.fbtn{font-size:13px!important;padding:6px 12px!important;display:inline-flex!important;flex-direction:row!important;align-items:center;margin:4px 6px 4px 0;font-weight:600!important;line-height:1.2;cursor:pointer}
.wiz.clic span{cursor:pointer} .wiz.clic span:hover{outline:2px solid var(--gold)}
.voce{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.voce h4{margin:0 0 6px;font-family:var(--display);color:var(--navy);font-size:16px}
.voce .riga{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start}
.voce label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.voce input,.voce select,.voce textarea{width:100%}
.voce textarea{min-height:64px}
@media (min-width:1100px){.tiles{grid-template-columns:repeat(6,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* pagina A4 */
.sheetwrap{overflow-x:auto}
.sheet{background:#fff;width:210mm;min-height:297mm;margin:0 auto 16px;box-shadow:0 4px 18px rgba(28,36,64,.22);position:relative;overflow:hidden;font-size:11px;line-height:1.35;color:#1E2624;padding-bottom:18mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .hd{background:linear-gradient(120deg,#1C2440,#304143);color:#F6F2E8;padding:10mm 12mm 8mm;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5mm solid #C2A970}
.sheet .hd.s{padding:7mm 12mm 5mm}
.sheet .lg{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;color:#C2A970;font-size:22px}
.sheet .sb{font-size:10px;opacity:.85;letter-spacing:.06em}
.sheet .tp{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.sheet .id{display:flex;gap:7mm;padding:8mm 12mm 3mm;align-items:center}
.sheet .ph{width:38mm;height:38mm;border-radius:50%;border:1.2mm solid #C2A970;object-fit:cover;background:#E9ECE6;display:grid;place-items:center;font-family:var(--display);font-size:40px;color:#1C2440;overflow:hidden;flex:none}
.sheet .nm{font-family:var(--display);font-size:30px;color:#1C2440;text-transform:uppercase;line-height:1.05}
.sheet .ch{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sheet .phw{position:relative;flex:none}
.sheet .phw .lvb{position:absolute;left:50%;bottom:2.5mm;transform:translateX(-50%);background:#1C2440;color:#fff;border-radius:99px;padding:1px 8px;font-size:10px;font-weight:700;line-height:1.5;white-space:nowrap}
.sheet .ag{margin-top:6px;font-size:12px;color:#5A6B80}
.sheet .ch span{background:#F4F5F1;border:1px solid #DCE1DC;border-radius:99px;padding:2px 9px;font-size:10.5px}
.sheet .md{margin-left:auto;text-align:center;border:1.2mm solid #1C2440;border-radius:50%;width:27mm;height:27mm;display:grid;place-items:center;flex:none}
.sheet .md b{font-family:var(--display);font-size:28px;color:#1C2440;line-height:1}
.sheet .md small{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#5E6B67}
.sheet .gr{display:grid;grid-template-columns:1fr 1fr;gap:6mm;padding:3mm 12mm 6mm}
.sheet .col{display:grid;gap:5mm;align-content:start}
.sheet .fc{height:85mm;border-radius:3mm;overflow:hidden;border:1.2mm solid #C2A970;background:#F4F5F1}
.sheet .fc img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .fc.vuota{border:1mm dashed #C2A970;display:grid;place-items:center;color:#5E6B67;font-size:13px;cursor:pointer;text-align:center;padding:4mm}
@media print{.sheet .fc.vuota{display:none}}
.sheet .ar{border:1px solid #DCE1DC;border-radius:3mm;padding:3mm 4mm;background:#FFFEFB;break-inside:avoid}
.sheet .ar h3{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:#1C2440;text-transform:uppercase;border-bottom:1.5px solid #C2A970;padding-bottom:2px;margin-bottom:5px}
.sheet .ar h3 b{font-size:17px}
.sheet .br{display:grid;grid-template-columns:36mm 1fr 8mm;gap:2.5mm;align-items:center;margin:3.5px 0;line-height:1.15}
.sheet .br i{display:block;height:7px;background:#ECEFEA;border-radius:4px;overflow:hidden}
.sheet .br u{display:block;height:100%;border-radius:4px}
.sheet .br em{font-style:normal;font-weight:700;text-align:right}
.sheet .lg2{display:flex;gap:10px;justify-content:center;font-size:9.5px;color:#5E6B67}
.sheet .lg2 i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sheet .ft{position:absolute;left:0;right:0;bottom:0;background:#1C2440;color:#CFC9B8;padding:4mm 12mm;font-size:9.5px;display:flex;justify-content:space-between;gap:8px}
.sheet .p2{padding:8mm 12mm 0}
.sheet .due{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.sheet .bx{border-left:1.6mm solid #1C2440;background:#F6F7F3;border-radius:0 3mm 3mm 0;padding:3mm 4mm;margin-bottom:5mm;break-inside:avoid}
.sheet .bx.ok{border-left-color:#2E7D5B} .sheet .bx.warn{border-left-color:#C9792B}
.sheet .bx h4,.sheet .ct{font-family:var(--display);font-size:14px;text-transform:uppercase;color:#1C2440;margin:0 0 4px;letter-spacing:.04em}
.sheet .bx ul{margin:0;padding-left:15px} .sheet .bx li{margin:2px 0}
.sheet .lv{display:grid;grid-template-columns:1fr 1fr;gap:3mm 6mm} .sheet .lv b{color:#1C2440;font-size:11px}
.sheet .ct{margin:2mm 0 3mm;border-bottom:1.5px solid #C2A970;padding-bottom:2px}
.sheet .cm{margin-bottom:3mm} .sheet .cm h5{margin:0 0 2px;font-size:11.5px;color:#C2A970;text-transform:uppercase;letter-spacing:.08em}
.sheet .cm p{margin:2px 0;font-size:10.5px}
@media (max-width:820px){.sheet{zoom:.42}}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  .top,.noprint,.hint{display:none!important}
  main{max-width:none;padding:0;margin:0}
  #view,#view.panel{padding:0;background:transparent;box-shadow:none}
  .sheetwrap{overflow:visible}
  .sheet{zoom:1!important;margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
}
</style>

<body>
<div class="top">
  <div class="row"><button class="back" id="back" hidden aria-label="Torna alla Home">‹ Home</button><h1 id="logo" style="cursor:pointer" title="Home"><span class="mono">P</span><span id="titolo">Planner</span></h1><span class="stato" id="stato"></span></div>
  <nav id="nav" hidden>
    <button data-v="home" class="on">Home</button>

    <button data-v="allievi">Allievi</button>
    <button data-v="promozioni">Promozioni</button>
    <button data-v="allenamenti">Richieste</button>
    <button data-v="schede">Schede tecniche</button>
  </nav>
</div>
<main id="view" class="panel"></main>

const ID = {

function errore(e){
  const c = e && e.code;
  if (c==="password") return "Password sbagliata.";
  if (c==="archivio") return "Salvato nel foglio, ma NON nell'archivio del sito. Riprova a salvare.";
  if (c==="rete") return "Non riesco a collegarmi ai fogli Google. Controlla la connessione e riprova.";
  return "Google ha rifiutato l'operazione: "+((e && e.message)||"errore sconosciuto")+".";

async function api(body, pw){
  let res;
  try { res = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({}, body, {pw: pw || leggiPw()}))}); }
  catch(e){ throw {code:"rete"}; }
  let j; try { j = await res.json(); } catch(e){ throw {code:"rete"}; }
  if (!j.ok) throw {code: j.error==="password" ? "password" : "tool_error", message: j.error};
  return j.data;
}
function dividi(r){ const i = r.lastIndexOf("!"); return {tab: r.slice(0,i).replace(/^'|'$/g,"").replace(/''/g,"'"), range: r.slice(i+1)}; }

async function caricaPlanner(){
  const d = await api({op:"planner"});
  const vals = d.values || [], col = d.colors || [];
  const sport = i => { const h = (col[i]||"").replace("#",""); if (h.length!==6) return ""; const r=parseInt(h.slice(0,2),16)/255, g=parseInt(h.slice(2,4),16)/255, b=parseInt(h.slice(4,6),16)/255;
    if (r>0.9 && b<0.5 && g>0.45 && g<0.8) return "tennis"; if (r>0.9 && g>0.8 && b<0.65) return "padel"; return ""; };
  const giorni = []; let cur = null;
  vals.forEach((row,i) => {
    if ((row[2]||"").trim()==="Allievo 1"){ const d = parseDmy(row[1]); cur = d ? {data:d, righe:[], note:[]} : null; if(cur) giorni.push(cur); return; }
    if (!cur) return;
    const b = (row[1]||"").trim(), nomi = row.slice(2,7).map(x=>(x||"").trim()).filter(Boolean), nota = (row[7]||"").trim();
    if (!b){ if (nota) cur.note.push(nota); return; }
    const m = b.match(/(\d{1,2})[:.](\d{2})/); if(!m) return;
    cur.righe.push({ora:m[1].padStart(2,"0")+":"+m[2], nomi, nota, sport: nomi.length ? sport(i) : ""});
  });
  giorni.forEach(g => g.righe.sort((a,b)=>a.ora.localeCompare(b.ora)));
  giorni.sort((a,b)=>a.data-b.data);
  return giorni;
}
function cardGiorno(g, tutte){
  const t = oggi(), isOggi = g.data.getTime()===t.getTime();
  const righe = tutte ? g.righe : g.righe.filter(r=>r.nomi.length);
  let h = '<div class="day'+(isOggi?' oggi':'')+'"><header><b>'+esc(GIORNI[g.data.getDay()])+'</b><span>'+dmy(g.data)+(isOggi?' · oggi':'')+'</span></header>';
  if (!righe.length) h += '<div class="vuoto">Nessun impegno</div>';
  righe.forEach(r => {
    h += '<div class="slot"><span class="ora">'+r.ora+'</span>';
    h += r.nomi.length ? '<span class="nomi '+r.sport+'">'+esc(r.nomi.join(", "))+(r.nota?'<small>'+esc(r.nota)+'</small>':'')+'</span>' : '<span class="vuoto" style="padding:0">libero</span>';
    h += '</div>';
  });
  if (g.note.length) h += '<div class="note">'+g.note.map(n=>'<div class="'+(/RICHIESTA SITO/i.test(n)?'rich':'')+'">'+esc(n)+'</div>').join("")+'</div>';
  return h+'</div>';
}

const nomeLocandina = u => (decodeURIComponent(String(u).split("/").pop()).replace(/^\d+_/,"").replace(/\.[a-z0-9]+$/i,"") || "locandina");
const unisciBytes = (...b) => { const r = new Uint8Array(b.reduce((s,x)=>s+x.length,0)); let o = 0; b.forEach(x=>{ r.set(x,o); o += x.length; }); return r; };
function pdfDaJpeg(jpg, w, h){ // PDF A4, immagine JPEG centrata e proporzionata
  const enc = new TextEncoder(), A4W = 595.28, A4H = 841.89, mg = 28;
  const sc = Math.min((A4W-2*mg)/w, (A4H-2*mg)/h), dw = w*sc, dh = h*sc, dx = (A4W-dw)/2, dy = (A4H-dh)/2;
  const cont = enc.encode("q "+dw.toFixed(2)+" 0 0 "+dh.toFixed(2)+" "+dx.toFixed(2)+" "+dy.toFixed(2)+" cm /Im0 Do Q");
  const oggetti = [
    enc.encode("<< /Type /Catalog /Pages 2 0 R >>"),
    enc.encode("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"),
    enc.encode("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+A4W+" "+A4H+"] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>"),
    unisciBytes(enc.encode("<< /Length "+cont.length+" >>\nstream\n"), cont, enc.encode("\nendstream")),
    unisciBytes(enc.encode("<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n"), jpg, enc.encode("\nendstream"))
  ];
  const parti = [], offs = []; let pos = 0;
  const scrivi = b => { parti.push(b); pos += b.length; };
  scrivi(enc.encode("%PDF-1.4\n"));
  oggetti.forEach((o,i) => { offs.push(pos); scrivi(enc.encode((i+1)+" 0 obj\n")); scrivi(o); scrivi(enc.encode("\nendobj\n")); });
  const xref = pos;
  let x = "xref\n0 "+(oggetti.length+1)+"\n0000000000 65535 f \n";
  offs.forEach(o => { x += String(o).padStart(10,"0")+" 00000 n \n"; });
  x += "trailer\n<< /Size "+(oggetti.length+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n";
  scrivi(enc.encode(x));
  return new Blob(parti, {type:"application/pdf"});
}
async function scaricaLocandinaPdf(url, btn){
  const nome = nomeLocandina(url), prima = btn ? btn.textContent : "";
  if (btn){ btn.disabled = true; btn.textContent = "Preparo il PDF…"; }
  try {
    const res = await fetch(url); if (!res.ok) throw new Error("download");
    const file = await res.blob(); let pdf;
    if (/pdf/i.test(file.type) || /\.pdf(\?|$)/i.test(url)) pdf = new Blob([file], {type:"application/pdf"});
    else {
      const bmp = await createImageBitmap(file);
      const cv = document.createElement("canvas"); cv.width = bmp.width; cv.height = bmp.height;
      const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(bmp,0,0);
      const jpg = await new Promise((ok,ko) => cv.toBlob(b => b ? ok(b) : ko(new Error("immagine")), "image/jpeg", .92));
      pdf = pdfDaJpeg(new Uint8Array(await jpg.arrayBuffer()), bmp.width, bmp.height);
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(pdf); a.download = nome+".pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch(e){ window.open(url, "_blank", "noopener"); }
  finally { if (btn){ btn.disabled = false; btn.textContent = prima; } }
}

  let j; try { j = await res.json(); } catch(e){ throw {code:"archivio", message:"risposta"}; }

  return j.data;
}

  await schCarica(true);

  const nSc = SCH.sc.length+1;

  const vv = SCH.vc.slice(1).filter(r=>cc(r,0)===sport && cc(r,2)).map(r=>[sid,nome,sport,cc(r,1),cc(r,2),"","",""]);
  if (vv.length){ const n = SCH.vo.length+1; await scrivi(ID.schede, "VOTI!A"+n+":H"+(n+vv.length-1), vv); }
  const nSi = SCH.si.length+1;
  await scrivi(ID.schede, "VALUTAZIONI!A"+nSi+":I"+nSi, [[sid,nome,sport,"","","","","",""]]);
  const nDc = SCH.dc.length+1;

function fotoNomeFile(testo){ return String(testo||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9._-]/g,"_"); }
// scrive il nome della foto nel foglio (VOTI colonna H o SCHEDE colonna N) e allinea l'archivio
async function fotoSegnaNome(sid, voce, nome){
  if (!voce){
    const i = SCH.sc.findIndex((r,k)=>k>0 && cc(r,0)===sid); if (i<0) throw {code:"tool_error", message:"scheda non trovata"};
    await scrivi(ID.schede, "SCHEDE!N"+(i+1)+":N"+(i+1), [[nome]]);
    while (SCH.sc[i].length<14) SCH.sc[i].push(""); SCH.sc[i][13] = nome;
  } else {
    const i = SCH.vo.findIndex((r,k)=>k>0 && cc(r,0)===sid && cc(r,4)===voce); if (i<0) throw {code:"tool_error", message:"voce non trovata"};
    await scrivi(ID.schede, "VOTI!H"+(i+1)+":H"+(i+1), [[nome]]);
    while (SCH.vo[i].length<8) SCH.vo[i].push(""); SCH.vo[i][7] = nome;
  }
  await schInviaDb(sid);
}
function fotoAttiva(sid, voce, dopo){
  const inp = $("#fotoIn"); if (!inp) return;
  const box = $("#fotoApp"), m = $("#fotoMsg");
  const del = $("#fotoDel"); if (del) del.onclick = async ()=>{ del.disabled = true; try { await fotoSegnaNome(sid, voce, ""); schWizSc(); } catch(e){ m.innerHTML = '<span style="color:var(--ko)">'+esc(errore(e))+'</span>'; del.disabled = false; } };
  const cam = $("#fotoCam"); if (cam) cam.onchange = ()=>{ const f = cam.files[0]; cam.value = ""; if (f) apri(f); };
  inp.onchange = ()=>{ const f = inp.files[0]; inp.value = ""; if (f) apri(f); };
  const apri = async f=>{
    let im; try { im = await fotoJpeg(f); } catch(e){ m.innerHTML = '<span style="color:var(--ko)">'+esc(errore(e))+'</span>'; return; }
    const ratio = voce ? 1.25 : 1; // colpi 4:5, profilo quadrato
    box.innerHTML = '<div style="margin-top:10px"><div id="cropFr" style="position:relative;overflow:hidden;width:100%;max-width:360px;background:#111;border-radius:12px;touch-action:none;cursor:move"><img id="cropImg" src="'+im.src+'" alt="" draggable="false" style="position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;max-width:none"></div><label style="display:block;margin-top:8px">Zoom <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" style="width:100%;max-width:360px"></label><div class="bar" style="margin:8px 0 0;gap:6px;flex-wrap:wrap"><button type="button" class="btn" id="cropOk">✓ Ritaglia e salva</button><button type="button" class="btn sec" id="cropNo">Annulla</button></div></div>';
    const fr = $("#cropFr"), ci = $("#cropImg"), zm = $("#cropZoom");
    let W = fr.clientWidth, H = W*ratio, sc0 = 1, z = 1, x = 0, y = 0;
    const fissa = () => { const s = sc0*z; x = Math.min(0, Math.max(W - im.width*s, x)); y = Math.min(0, Math.max(H - im.height*s, y)); ci.style.transform = "translate("+x+"px,"+y+"px) scale("+s+")"; };
    fr.style.height = H+"px";
    sc0 = Math.max(W/im.width, H/im.height); x = (W - im.width*sc0)/2; y = (H - im.height*sc0)/2; fissa();
    zm.oninput = ()=>{ z = Number(zm.value); fissa(); };
    let drag = null;
    fr.onpointerdown = e=>{ drag = {px:e.clientX, py:e.clientY, x0:x, y0:y}; fr.setPointerCapture(e.pointerId); };
    fr.onpointermove = e=>{ if (!drag) return; x = drag.x0 + (e.clientX-drag.px); y = drag.y0 + (e.clientY-drag.py); fissa(); };
    fr.onpointerup = fr.onpointercancel = ()=>{ drag = null; };
    $("#cropNo").onclick = ()=>{ box.innerHTML = ""; m.textContent = "Ritaglia la foto e salvala: va direttamente nell'archivio della scheda."; };
    $("#cropOk").onclick = async ()=>{ const b = $("#cropOk"); b.disabled = true; m.textContent = "Salvo la foto…";
      try {
        const s = sc0*z, sx = -x/s, sy = -y/s, sw = W/s, sh = H/s;
        const ow = Math.min(1000, Math.round(sw)), oh = Math.round(ow*ratio);
        const c = document.createElement("canvas"); c.width = ow; c.height = oh;
        c.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, ow, oh);
        const img = c.toDataURL("image/jpeg", 0.85).split(",")[1];
        const sc = SCH.sc.find((r,k)=>k>0 && cc(r,0)===sid);
        const nomeFile = fotoNomeFile(cc(sc,2)) + "_" + (voce ? fotoNomeFile(voce) : "profilo") + "_" + Date.now() + "_ritaglio.jpg";
        await salvaApi({op:"salvaFoto", id: sid, nome: nomeFile, img});
        await fotoSegnaNome(sid, voce, nomeFile);
        schWizSc();
      } catch(e){ b.disabled = false; m.innerHTML = '<span style="color:var(--ko)">'+esc(errore(e))+'</span>'; }
    };
  };
}

  } else {
    h += '<div class="panel" style="padding:14px"><p class="msg ok">Dati anagrafici salvati nel database.</p><h3>Quale scheda vuoi compilare?</h3><div class="bar" id="scelte"></div><p class="hint">Se l\'allievo gioca sia a tennis sia a padel puoi compilare entrambe, una dopo l\'altra.</p></div>';

function schLeggiAn(){
  const d = schUI.draft, s = schUI.step;
  if (s >= AN_STEPS.length) return;
  AN_STEPS[s].f.forEach(([lab,col,tipo])=>{ const el = $("#w"+col); if(!el) return; d[col] = tipo==="date" ? isoToDmy(el.value) : el.value.trim(); });
}
async function schSalvaAn(){
  await schCarica(true);
  const d = schUI.draft.map(x=>x==null?"":String(x));
  let row, vecchio = null;
  if (!schUI.pid){
    const max = Math.max(0, ...schPers().map(x=>parseInt(cc(x.r,0).replace(/\D/g,""),10)||0));
    schUI.pid = "P"+String(max+1).padStart(2,"0"); d[0] = schUI.pid; d[10] = ""; row = SCH.an.length+1;
  } else {
    const p = schPers().find(x=>cc(x.r,0)===schUI.pid); row = p.row; vecchio = cc(p.r,1)+" "+cc(p.r,2); d[0] = schUI.pid; d[10] = cc(p.r,10);
  }
  schUI.draft = d;
  await scrivi(ID.schede, "ANAGRAFICA!A"+row+":L"+row, [d]);
  const nuovo = d[1]+" "+d[2];
  if (vecchio && vecchio !== nuovo){
    for (const x of schDi(schUI.pid)){
      const sid = cc(x.r,0);
      await schColonna("SCHEDE", SCH.sc, 2, sid, nuovo); await schColonna("VOTI", SCH.vo, 1, sid, nuovo);
      await schColonna("VALUTAZIONI", SCH.si, 1, sid, nuovo); await schColonna("DOCUMENTI", SCH.dc, 1, sid, nuovo);
    }
  }
  await schCarica(true);
  for (const x of schDi(schUI.pid)) await schSegna(cc(x.r,0), nuovo, cc(x.r,3));
  for (const x of schDi(schUI.pid)) await schInviaDb(cc(x.r,0));
}

/* ---------- scheda tecnica a passi ---------- */
function schWizSc(){
  const v = $("#view"), sid = schUI.sid, s = schUI.step;
  const sc = SCH.sc.slice(1).map((r,i)=>({r,row:i+2})).find(x=>cc(x.r,0)===sid);
  if (!sc){ schUI.v="lista"; return schLista(); }
  const sport = cc(sc.r,3);
  const key = sid+":"+s; if (schUI.key!==key){ schUI.key=key; schVi=0; }
  let h = '<div class="bar"><button class="btn sec" id="esci">‹ Torna all\'allievo</button><h2 style="margin-right:auto">'+esc(cc(sc.r,2))+' · '+pillSport(sport)+'</h2></div>'+wizBar(SC_STEPS, s).replace('class="wiz"','class="wiz clic" title="Tocca un passo per andarci direttamente"')+'<form class="form" id="frm">';
  const voti = [];
  if (s===0){
    h += '<h3 class="full">Dati della scheda</h3>'+
      [["Stagione",4,"text"],["Livello",8,"text"],["Mano",6,"mano"],["Lato di gioco",7,"text"],["Inizio corso",9,"date"],["Corso",10,"text"]].map(([lab,col,tipo])=>{
        const val = cc(sc.r,col), id = "s"+col;
        if (tipo==="mano") return '<label for="'+id+'">'+lab+'<select id="'+id+'"><option value=""></option><option'+(val==="Destra"?' selected':'')+'>Destra</option><option'+(val==="Sinistra"?' selected':'')+'>Sinistra</option></select></label>';
        if (tipo==="date") return '<label for="'+id+'">'+lab+'<input id="'+id+'" type="date" value="'+dmyToIso(val)+'"></label>';
        return '<label for="'+id+'"'+(lab==="Corso"?' class="full"':'')+'>'+lab+'<input id="'+id+'" value="'+esc(val)+'"></label>';
      }).join("");
    h += fotoBox(cc(sc.r,13) ? [cc(sc.r,13)] : [], "Foto profilo");
  } else if (s>=1 && s<=4){
    const area = SCH_AREE[s-1];
    SCH.vo.forEach((r,i)=>{ if (i>0 && cc(r,0)===sid && cc(r,3)===area) voti.push({r,row:i+1}); });
    if (!voti.length) h += '<p class="full msg info">In questa area non ci sono voci nel database.</p>';
    else {
      if (schVi<0 || schVi>=voti.length) schVi = schVi<0 ? voti.length-1 : 0;
      const r = voti[schVi].r;
      h += '<div class="full voci" id="voci">'+voti.map((x,j)=>'<span data-j="'+j+'" class="'+(j===schVi?'on':(nVoto(cc(x.r,5))?'ok':''))+'">'+esc(cc(x.r,4))+'</span>').join("")+'</div>';
      h += '<div class="full" style="display:grid;gap:12px"><div style="color:var(--muted);font-weight:600">'+area+' · voce '+(schVi+1)+' di '+voti.length+'</div><h2 style="font-size:30px;color:var(--navy)">'+esc(cc(r,4))+'</h2>'+
        '<label>Voto da 1 a 10 (anche 6,5)<input id="v0" type="number" min="1" max="10" step="0.5" inputmode="decimal" value="'+esc(nVoto(cc(r,5)))+'" style="font-size:24px;max-width:150px"></label>'+
        '<label>Commento<textarea id="d0" placeholder="Scrivi qui il commento…" style="min-height:220px;font-size:18px;background:#fff">'+esc(cc(r,6))+'</textarea></label>'+fotoBox(righeTxt(cc(r,7).replace(/,\s*/g,"\n")), "Foto del colpo")+videoBox()+'</div>';
    }
  } else if (s===5){
    const si = SCH.si.slice(1).map((r,i)=>({r,row:i+2})).find(x=>cc(x.r,0)===sid);
    const c = i => si ? cc(si.r,i) : "";
    h += '<h3 class="full">Valutazioni finali <small style="color:var(--muted);font-size:14px">una voce per riga</small></h3>'+
      [["Punti di forza",3],["Punti deboli",4],["Lavori consigliati – Tecnico",5],["Lavori consigliati – Tattico",6],["Lavori consigliati – Fisico",7],["Lavori consigliati – Mentale",8]].map(([lab,i])=>'<label class="full" for="y'+i+'">'+lab+'<textarea id="y'+i+'">'+esc(c(i))+'</textarea></label>').join("");
  } else {
    SCH.dc.forEach((r,i)=>{ if (i>0 && cc(r,0)===sid) voti.push({r,row:i+1}); });
    h += '<h3 class="full">Documenti</h3>';
    if (!voti.length) h += '<p class="full msg info">Nessun documento nel database.</p>';
    voti.forEach(({r},k)=>{
      const st = cc(r,4);
      h += '<div class="voce full"><h4>'+esc(cc(r,3))+'</h4><div class="riga" style="grid-template-columns:1fr 1fr"><label>Stato<select id="e'+k+'"><option value=""></option>'+["consegnato","da consegnare","scaduto"].map(o=>'<option'+(st===o?' selected':'')+'>'+o+'</option>').join("")+'</select></label><label>Scadenza<input id="f'+k+'" type="date" value="'+dmyToIso(cc(r,5))+'"></label><label style="grid-column:1/-1">Note<input id="g'+k+'" value="'+esc(cc(r,6))+'"></label></div></div>';
    });
  }
  const eVoce = s>=1 && s<=4 && voti.length>0, ultimaV = eVoce && schVi>=voti.length-1;
  h += '<div class="azioni">'+(s>0?'<button class="btn sec" type="button" id="ind">‹ Indietro</button>':'')+'<button class="btn sec" type="button" id="salta">'+(s===SC_STEPS.length-1?'Chiudi senza salvare':eVoce?'Salta voce ›':'Salta ›')+'</button><button class="btn" type="submit">'+(s===SC_STEPS.length-1?'Salva e finisci':eVoce&&!ultimaV?'Salva e prossima voce ›':'Salva e avanti ›')+'</button></div><p class="full msg err" id="ferr" hidden></p></form>';
  v.innerHTML = h;
  caricaFotoSalvate(v, sid);
  window.scrollTo(0,0);
  if (s===0) fotoAttiva(sid, "", ()=>{});
  if (s>=1 && s<=4 && voti.length){ const rr = voti[schVi].r; fotoAttiva(sid, cc(rr,4), ()=>{}); caricaVideo(sid, cc(rr,4)); }
  const esci = msg => { schUI.v = "persona"; schUI.pid = cc(sc.r,1); vistaSchede(null,msg); };
  $("#esci").onclick = ()=>esci();
  let modificato = false; $("#frm").addEventListener("input", ()=>{ modificato = true; });
  v.querySelectorAll(".wiz.clic span").forEach((sp,i)=>{ sp.onclick = ()=>{
    if (i===s) return;
    if (modificato && !confirm("In questa pagina ci sono modifiche non salvate. Vuoi passare a «"+SC_STEPS[i]+"» senza salvarle?")) return;
    schUI.step = i; schVi = 0; schUI.key = sid+":"+i; schWizSc(); }; });
  v.querySelectorAll("#voci span").forEach(sp=>{ sp.onclick = ()=>{ const j = +sp.dataset.j;
    if (j===schVi) return;
    if (modificato && !confirm("In questa voce ci sono modifiche non salvate. Vuoi passare a «"+sp.textContent+"» senza salvarle?")) return;
    schVi = j; schWizSc(); }; });
  const vOn = v.querySelector("#voci span.on"); if (vOn) vOn.scrollIntoView({block:"nearest",inline:"center"});
  if ($("#ind")) $("#ind").onclick = ()=>{ if (eVoce && schVi>0){ schVi--; return schWizSc(); } schUI.step--; if (schUI.step>=1 && schUI.step<=4){ schVi=-1; } else schVi=0; schUI.key = sid+":"+schUI.step; schWizSc(); };
  $("#salta").onclick = ()=>{ if (s===SC_STEPS.length-1) return esci(); if (eVoce && !ultimaV){ schVi++; return schWizSc(); } schUI.step++; schVi=0; schUI.key = sid+":"+schUI.step; schWizSc(); };
  $("#frm").onsubmit = async e=>{
    e.preventDefault();
    const err = $("#ferr"), bt = $("#frm button[type=submit]"), tb = bt.textContent; err.hidden = true;
    const ag = aggOggi();
    try{
      if (s===1 || s===2 || s===3 || s===4){
        if (voti.length){
          const t = $("#v0").value.trim().replace(",","."); const n = t===""?"":parseFloat(t); if (t!=="" && (isNaN(n)||n<1||n>10)) throw {code:"tool_error", message:"voto non valido (da 1 a 10)"};
          const txt = $("#d0").value.trim();
          bt.disabled = true; bt.textContent = "Salvo…";
          await scrivi(ID.schede, "VOTI!F"+voti[schVi].row+":G"+voti[schVi].row, [[n, txt]]);
          const rr = SCH.vo[voti[schVi].row-1]; while (rr.length<7) rr.push(""); rr[5] = String(n).replace(".",","); rr[6] = txt;
        }
      } else if (s===0){
        const g = c => { const el = $("#s"+c); return el.type==="date" ? isoToDmy(el.value) : el.value.trim(); };
        bt.disabled = true; bt.textContent = "Salvo…";
        await scrivi(ID.schede, "SCHEDE!E"+sc.row+":L"+sc.row, [[g(4), cc(sc.r,5), g(6), g(7), g(8), g(9), g(10), cc(sc.r,11)]]);
      } else if (s===5){
        const si = SCH.si.slice(1).map((r,i)=>({r,row:i+2})).find(x=>cc(x.r,0)===sid);
        const row = si ? si.row : SCH.si.length+1;
        const vals = [3,4,5,6,7,8].map(i=>righeTxt($("#y"+i).value).join("\n"));
        bt.disabled = true; bt.textContent = "Salvo…";
        if (!si) await scrivi(ID.schede, "VALUTAZIONI!A"+row+":C"+row, [[sid, cc(sc.r,2), sport]]);
        await scrivi(ID.schede, "VALUTAZIONI!D"+row+":I"+row, [vals]);
      } else {
        const vals = voti.map((_,k)=>[$("#e"+k).value, isoToDmy($("#f"+k).value), $("#g"+k).value.trim()]);
        bt.disabled = true; bt.textContent = "Salvo…";
        let i = 0;
        while (i < voti.length){ let j = i; while (j+1<voti.length && voti[j+1].row===voti[j].row+1) j++;
          await scrivi(ID.schede, "DOCUMENTI!E"+voti[i].row+":G"+voti[j].row, vals.slice(i,j+1)); i = j+1; }
      }
      await scrivi(ID.schede, "SCHEDE!M"+sc.row, [[ag]]);
      await schSegna(sid, cc(sc.r,2), sport);
      if (!(s>=1 && s<=4)) await schCarica(true);
      await schInviaDb(sid);
      if (s === SC_STEPS.length-1) return esci("Scheda "+sport.toLowerCase()+" di "+cc(sc.r,2)+" salvata nel database: la scheda sul sito è già aggiornata.");
      if (s>=1 && s<=4 && voti.length && schVi<voti.length-1){ schVi++; return schWizSc(); }
      schUI.step++; schVi=0; schUI.key = sid+":"+schUI.step; schWizSc();
    }catch(x){ err.hidden = false; err.textContent = (x && x.code==="tool_error" && x.message && x.message.startsWith("voto")) ? x.message : errore(x); bt.disabled = false; bt.textContent = tb; }
  };
}

/* ---------- stampa: pagina riepilogativa A4 ---------- */
const schFoto = {}, schFotoColpo = {}, schFcLetta = {};

const schBarCol = n => n>=8 ? "#2E7D5B" : n>=6 ? "#C2A970" : "#C9792B";
const schFmt = n => String(n).replace(".",",");
function schStampa(sid){
  const v = $("#view"), sc = SCH.sc.slice(1).find(r=>cc(r,0)===sid);
  if (!sc){ schUI.v="lista"; return schLista(); }
  const pr = SCH.an.slice(1).find(r=>cc(r,0)===cc(sc,1)) || [];
  const sport = cc(sc,3), nome = (cc(pr,2)+" "+cc(pr,1)).trim() || cc(sc,2);

    return `<section class="ar"><h3><span>${esc(a.a)}</span><b>${schFmt(media(a.v))}</b></h3>`+k.map(x=>`<div class="br"><span>${esc(x.voce)}</span><i><u style="width:${x.n*10}%;background:${schBarCol(x.n)}"></u></i><em>${schFmt(x.n)}</em></div>`).join("")+`</section>`; };
  const lista = i => righeTxt(cc(si,i));
  const ul = (arr) => arr.length ? "<ul>"+arr.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>" : "";
  const chip = (l,x) => x ? `<span><b>${l}</b> ${esc(x)}</span>` : "";
  const forza = lista(3), deboli = lista(4);
  const lavori = [["Tecnico",5],["Tattico",6],["Fisico",7],["Mentale",8]].map(([l,i])=>[l,lista(i)]).filter(x=>x[1].length);

  const foto = schFoto[sid], fc = schFotoColpo[sid];
  const fotoProf = cc(sc,13).trim();
  const agg = (()=>{ const t = cc(sc,12).trim(); const m = t.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return MESI[+m[2]-1]+" "+m[3]; const k = t.match(/([a-zà]+)\s+(\d{4})/i); return k ? k[1].toLowerCase()+" "+k[2] : t; })();
  const fotoBox = fc ? `<div class="fc"><img src="${fc}" alt=""></div>` : `<label class="fc vuota" for="fotoc">Spazio per la foto più bella<br><small>tocca per sceglierla</small></label>`;
  const colSx = blocco(aree[0]) + fotoBox, colDx = aree.slice(1).map(blocco).join("");
  let pag2 = "";

      (comm.length ? `<h4 class="ct">Commenti del maestro</h4>`+comm.map(c=>`<div class="cm"><h5>${esc(c.a)}</h5>${c.v.map(x=>`<p><b>${esc(x.voce)}</b>${x.n!==""?" ("+schFmt(x.n)+")":""} – ${esc(x.d)}</p>`).join("")}</div>`).join("") : "")+
      `</div><div class="ft"><span>A.S.D. Sport &amp; Services</span><span>Aggiornata: ${esc(cc(sc,12))}</span></div></div>`;
  }
  v.innerHTML = `<div class="bar noprint"><button class="btn sec" id="ind">‹ Indietro</button><h2 style="margin-right:auto">Stampa: ${esc(nome)} · ${esc(sport.toLowerCase())}</h2>`+
    `<label class="btn sec" style="display:inline-block">${foto?"Cambia ritratto":"Aggiungi ritratto"}<input id="foto" type="file" accept="image/*" hidden></label><label class="btn sec" style="display:inline-block">${fc?"Cambia foto grande":"Aggiungi foto grande"}<input id="fotoc" type="file" accept="image/*" hidden></label>${fc?'<button class="btn sec" id="togfc">Togli foto grande</button>':''}<button class="btn sec" id="modsc">Modifica scheda</button><button class="btn" id="stampa">Stampa / Salva PDF</button></div>`+
    `<p class="hint noprint">La foto grande sotto la tecnica si salva nella scheda: la ritrovi ogni volta che riapri la stampa. Il ritratto nel cerchio è quello della scheda; se lo cambi qui vale solo per questa stampa. Se la stampa non parte da qui, usa il menu del browser «Stampa» e scegli «Salva come PDF», formato A4.</p><div id="perr"></div>`+
    `<div class="sheetwrap"><div class="sheet"><div class="hd"><div><div class="lg">Sport &amp; Services</div><div class="sb">A.S.D. · Scuola di tennis e padel</div></div><div class="tp">Scheda tecnica ${esc(sport)}</div></div>`+

  $("#foto").onchange = e => {

    rd.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(im.width, im.height), c = document.createElement("canvas"); c.width = c.height = 500; c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,500,500); schFoto[sid] = c.toDataURL("image/jpeg",.88); schStampa(sid); }; im.src = rd.result; };
    rd.readAsDataURL(f);
  };
  $("#fotoc").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    let im; try { im = await fotoJpeg(f); } catch(x){ $("#perr").innerHTML = '<p class="msg err">'+esc(errore(x))+'</p>'; return; }
    const fcEl = document.querySelector(".sheet .fc"), ratio = fcEl && fcEl.clientWidth ? fcEl.clientHeight/fcEl.clientWidth : 0.95;
    const box = $("#perr");
    box.innerHTML = '<div class="noprint panel" style="padding:12px;margin:10px 0"><h3 style="margin-top:0">Ritaglia la foto grande</h3><p class="hint">Trascina la foto e usa lo zoom, poi premi Salva foto: resta salvata nella scheda.</p><div id="cropFr" style="position:relative;overflow:hidden;width:100%;max-width:420px;background:#111;border-radius:12px;touch-action:none;cursor:move"><img id="cropImg" src="'+im.src+'" alt="" draggable="false" style="position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;max-width:none"></div><label style="display:block;margin-top:8px">Zoom <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" style="width:100%;max-width:420px"></label><div class="bar" style="margin:8px 0 0;gap:6px;flex-wrap:wrap"><button type="button" class="btn" id="cropOk">✓ Salva foto</button><button type="button" class="btn sec" id="cropNo">Annulla</button></div></div>';
    const fr = $("#cropFr"), ci = $("#cropImg"), zm = $("#cropZoom");
    const W = fr.clientWidth, H = W*ratio; let z = 1, x = 0, y = 0;
    fr.style.height = H+"px";
    const sc0 = Math.max(W/im.width, H/im.height);
    const fissa = () => { const sc = sc0*z; x = Math.min(0, Math.max(W - im.width*sc, x)); y = Math.min(0, Math.max(H - im.height*sc, y)); ci.style.transform = "translate("+x+"px,"+y+"px) scale("+sc+")"; };
    x = (W - im.width*sc0)/2; y = (H - im.height*sc0)/2; fissa();
    zm.oninput = ()=>{ const c = sc0*z, cx = (W/2 - x)/c, cy = (H/2 - y)/c; z = Number(zm.value); const n = sc0*z; x = W/2 - cx*n; y = H/2 - cy*n; fissa(); };
    let drag = null;
    fr.onpointerdown = ev=>{ drag = {px:ev.clientX, py:ev.clientY, x0:x, y0:y}; fr.setPointerCapture(ev.pointerId); };
    fr.onpointermove = ev=>{ if (!drag) return; x = drag.x0 + (ev.clientX-drag.px); y = drag.y0 + (ev.clientY-drag.py); fissa(); };
    fr.onpointerup = fr.onpointercancel = ()=>{ drag = null; };
    box.scrollIntoView({behavior:"smooth", block:"start"});
    $("#cropNo").onclick = ()=>{ box.innerHTML = ""; };
    $("#cropOk").onclick = async ()=>{
      const b = $("#cropOk"); b.disabled = true; b.textContent = "Salvo la foto…";
      const sc = sc0*z, sx = -x/sc, sy = -y/sc, sw = W/sc, sh = H/sc;
      const ow = Math.min(1400, Math.round(sw)), oh = Math.round(ow*ratio);
      const c = document.createElement("canvas"); c.width = ow; c.height = oh;
      c.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, ow, oh);
      const url = c.toDataURL("image/jpeg", 0.88);
      try { await salvaApi({op:"salvaFoto", id: sid, nome: FC_NOME, img: url.split(",")[1]}); }
      catch(x){ b.disabled = false; b.textContent = "✓ Salva foto"; box.insertAdjacentHTML("beforeend", '<p class="msg err">Foto non salvata: '+esc(errore(x))+'. Riprova.</p>'); return; }
      schFotoColpo[sid] = url; schStampa(sid);
      $("#perr").innerHTML = '<p class="msg ok noprint">Foto grande salvata nella scheda.</p>';
    };
  };
  if ($("#togfc")) { let conf = false; $("#togfc").onclick = async function(){
    if (!conf){ conf = true; this.textContent = "Conferma: togli e cancella la foto"; return; }
    this.disabled = true;
    try { await salvaApi({op:"togliFoto", id: sid, nome: FC_NOME}); }
    catch(x){ this.disabled = false; $("#perr").innerHTML = '<p class="msg err">Non riesco a togliere la foto: '+esc(errore(x))+'</p>'; return; }
    delete schFotoColpo[sid]; schStampa(sid); }; }
}

/* ===================== HOME ===================== */
const ICONE = {
  planner:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h3M7 17h6"/></svg>',
  giocatori:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="18" cy="15.5" r="3.2"/><path d="M15.8 13.3l4.4 4.4"/></svg>',
  allievi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c2 2 10 2 12 0v-5M22 9v6"/></svg>',
  promozioni:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11v2a1 1 0 001 1h3l6 4V6L7 10H4a1 1 0 00-1 1z"/><path d="M17 9a4 4 0 010 6M19.5 6.5a7.5 7.5 0 010 11"/></svg>',
  allenamenti:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6c3 2.6 3 10.2 0 12.8M18.4 5.6c-3 2.6-3 10.2 0 12.8"/></svg>'
};
ICONE.schede = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3M8.5 10h7M8.5 14h7M8.5 18h4"/></svg>';
const TILE = [["planner","Planner","14 giorni, giorno e settimana"],["giocatori","Giocatori allenamento","Nome, livello, circolo"],["allievi","Allievi","Padel e tennis, contatti e livello"],["promozioni","Promozioni","<em>Promozioni per corsi - lezioni - clinic e tornei</em>"],["allenamenti","Richieste","<em>Richieste di disponibilità ed allenamento</em>"],["schede","Schede tecniche","Anagrafica e schede tennis/padel"]];
async function vistaHome(refresh){
  const v = $("#view"); v.classList.add("home");
  const t = oggi();
  const tiles = '<div class="tiles">'+TILE.map(([k,l,d])=>'<button class="tile'+(k==="planner"||k==="schede"?' big':'')+'" data-go="'+k+'">'+ICONE[k]+'<b>'+l+'</b><small>'+d+'</small></button>').join("")+'</div>';
  const disegna = (dati, err) => {
    const g = dati.planner ? dati.planner.find(x=>x.data.getTime()===t.getTime()) : null;
    const imp = g ? g.righe.filter(r=>r.nomi.length) : [];
    const dom = dati.planner ? dati.planner.find(x=>x.data.getTime()===t.getTime()+864e5) : null;
    const nDom = dom ? dom.righe.filter(r=>r.nomi.length).length : 0;
    const cmd = [...(dati.promozioni||[]).map(r=>({d:r[0],t:(r[1]?r[1]+" · ":"")+(r[2]||"")+(r[3]?" "+r[3]:"")+": "+String(r[6]||"").slice(0,60),s:r[8],k:"Promozione"})),...(dati.allenamenti||[]).map(r=>({d:r[0],t:(r[1]?r[1]+" · ":"")+nomeTipo(r[2])+(r[3]?" "+r[3]:"")+(r[4]?" alle "+r[4]:"")+(r[5]?", "+r[5]:"")+(r[6]?", livello "+r[6]:""),s:r[10],k:"Richiesta"}))]
      .filter(c=>{const d=parseDmy(c.d); return d && d>=t && !/fatt|eseguit/i.test(c.s||"");}).sort((a,b)=>parseDmy(a.d)-parseDmy(b.d));
    let h = '';
    if (err) h += '<p class="msg err">'+esc(err)+'</p>';
    h = tiles + h + '<div class="duo"><div class="box"><h3>Oggi · '+esc(nomeGiorno(t))+'</h3>';
    if (!dati.planner) h += '<div class="vuoto">'+(err?'Planner non disponibile.':'Leggo il planner…')+'</div>';
    else if (!imp.length) h += '<div class="vuoto">Nessun impegno oggi.</div>';
    else imp.forEach(r=>{ h += '<div class="slot"><span class="ora">'+r.ora+'</span><span class="nomi '+r.sport+'">'+esc(r.nomi.join(", "))+(r.nota?'<small>'+esc(r.nota)+'</small>':'')+'</span></div>'; });
    h += '</div><div class="box"><h3>Prossimi comandi</h3>';
    if (!dati.promozioni) h += '<div class="vuoto">'+(err?'Comandi non disponibili.':'Leggo i comandi…')+'</div>';
    else if (!cmd.length) h += '<div class="vuoto">Nessun comando in programma.</div>';
    else cmd.slice(0,5).forEach(c=>{ h += '<div class="cmd"><span class="d">'+esc(c.d)+'</span><span><b>'+c.k+':</b> '+esc(c.t)+'</span></div>'; });
    h += '</div></div>';
    v.innerHTML = h;
    v.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>mostra(b.dataset.go));
  };
  const dati = {planner: refresh?null:cache.planner, promozioni: refresh?null:cache.promozioni, allenamenti: refresh?null:cache.allenamenti};
  disegna(dati);
  try{
    const [p, pr, al] = await Promise.all([dati.planner||caricaPlanner(), dati.promozioni||caricaComandi("promozioni"), dati.allenamenti||caricaComandi("allenamenti")]);
    cache.planner=p; cache.promozioni=pr; cache.allenamenti=al;
    disegna({planner:p, promozioni:pr, allenamenti:al});
  }catch(e){ disegna(dati, errore(e)); }
}

/* ===================== ACCESSO ===================== */
function vistaAccesso(msg){
  $("#back").hidden = true; $("#view").classList.remove("home");
  $("#view").innerHTML = '<form class="form" id="acc" style="max-width:420px;margin:30px auto"><h3 class="full">Entra nel Planner</h3>'+(msg?'<p class="full msg err">'+esc(msg)+'</p>':'')+
    '<label for="pw" class="full">Password<input id="pw" type="password" autocomplete="current-password" required></label><div class="azioni"><button class="btn" type="submit">Entra</button></div><p class="full hint">La password serve una volta sola su questo dispositivo: poi il Planner la ricorda.</p></form>';
  $("#pw").focus();
  $("#acc").onsubmit = async e => { e.preventDefault(); const p = $("#pw").value.trim(); const b = $("#acc button"); b.disabled = true;
    try { await api({op:"prova"}, p); salvaPw(p); mostra("home"); } catch(err){ vistaAccesso(errore(err)); } };
}
/* ===================== AVVIO ===================== */
async function mostra(v, refresh){
  if (v==="schede" && vista!=="schede") schUI = {v:"menu", pid:null, sid:null, step:0, draft:null, q:"", mode:"modifica"};
  vista = v;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  try { location.hash = v; } catch(e){}
  if (!leggiPw()) return vistaAccesso();
  $("#view").classList.toggle("home", v==="home");
  $("#back").hidden = v==="home";
  const tl = {home:"Planner",planner:"Planner",giocatori:"Giocatori",allievi:"Allievi",promozioni:"Promozioni",allenamenti:"Richieste",schede:"Schede tecniche"};
  $("#titolo").textContent = tl[v]||"Planner";
  window.scrollTo(0,0);
  try{
    if (v==="home") await vistaHome(refresh);
    else if (v==="planner") await vistaPlanner(refresh);
    else if (v==="schede") await vistaSchede(refresh);
    else if (ELENCHI[v]) await vistaElenco(v, refresh);
    else { if (!cache.dbR || refresh) { try{ cache.dbR = await leggi(ID.comandi, "DATABASE RICHIESTE!A2:J1000"); }catch(e){ cache.dbR = []; } }
      if (v==="promozioni" && (!cache.dbP || refresh)) { try{ cache.dbP = await leggi(ID.comandi, "DATABASE PROMOZIONI!A2:J1000"); }catch(e){ cache.dbP = []; } }
      if (v==="promozioni" && (!cache.dbS || refresh)) { try{ cache.dbS = await leggi(ID.comandi, "PROVENIENZA SITO!A2:I1000"); }catch(e){ cache.dbS = []; } }
      await vistaComandi(v, refresh); }
    $("#stato").textContent = "";
  }catch(e){
    if (e && e.code==="password"){ salvaPw(""); return vistaAccesso("La password non è più valida: inseriscila di nuovo."); }
    $("#view").innerHTML = '<p class="msg err">'+esc(errore(e))+'</p><button class="btn" id="riprova">Riprova</button>';
    $("#riprova").onclick = ()=>mostra(v,true);
    $("#stato").textContent = "Fogli non raggiungibili";
  }
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>mostra(b.dataset.v));
$("#logo").onclick=()=>mostra("home");
$("#back").onclick=()=>mostra("home");
window.addEventListener("hashchange", ()=>{ const h = location.hash.slice(1); if (h && h!==vista && document.querySelector('#nav [data-v="'+h+'"]')) mostra(h); });
(()=>{
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
  const h = location.hash.slice(1);
  mostra(document.querySelector('#nav [data-v="'+h+'"]') ? h : "home");
})();
</script>
